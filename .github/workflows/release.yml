name: Release

# Builds the Windows installer (.exe) and the macOS disk image (.dmg) into a draft release,
# plus the signed update files (.sig, .app.tar.gz, latest.json) the installed apps check at launch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v${VERSION}"
          if gh release list -R "${{ github.repository }}" --limit 20 --json tagName --jq '.[].tagName' | grep -Fxq "$TAG"; then
            echo "Release $TAG already exists."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" \
              -R "${{ github.repository }}" \
              --draft \
              --title "Zaimule ${TAG}" \
              --notes "" \
              --target "${{ github.sha }}"; then
              echo "Created draft release $TAG."
              exit 0
            fi
            echo "Draft release creation attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          exit 1

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            targets: ""
          - os: macos-latest
            # `app` too: the updater installs the .app.tar.gz, which a dmg-only build drops.
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - run: npm install -g @tauri-apps/cli@2
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Zaimule v__VERSION__
          releaseDraft: true
          retryAttempts: 4

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tag pushes publish exactly their own draft; manual runs fall back to the newest draft.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(gh release list -R "${{ github.repository }}" --limit 5 --json tagName,isDraft --jq '.[] | select(.isDraft == true) | .tagName' | head -n 1)
          fi
          if [ -n "$TAG" ]; then
            gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --latest
          fi
