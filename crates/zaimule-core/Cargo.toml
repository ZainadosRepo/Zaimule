[package]
name = "zaimule-core"
version = "1.2.0"
description = "Multi-console ROM catalog, CRC32/SHA256 hasher, IPS patcher & Community Mod Hub, SRAM Hex Inspector, Memory Watchpoints, 60s rewind ring-buffer, visual keymapper, TAS Studio Timeline, Ghost Leaderboards, and P2P netplay/tournament protocol for Zaimule"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[dependencies]
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
