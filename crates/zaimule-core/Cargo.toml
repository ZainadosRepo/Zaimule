[package]
name = "zaimule-core"
version = "1.9.0"
description = "ROM catalog, Switch Torzu/Fritchii vault, pure-Rust ZIP/7z extractors, CRC32/SHA256 hasher, IPS patcher, SRAM inspector, watchpoints, 60s rewind, visual keymapper, and Link Cable sync for Zaimule"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[dependencies]
base64 = "0.23.1"
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util", "aes256", "deflate", "ppmd"] }
walkdir = "2.5"

[dev-dependencies]
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["compress", "util", "aes256", "deflate", "ppmd"] }
