[package]
name = "zaimule-emu"
version = "1.5.0"
description = "Native Rust emulator cores (Game Boy/GBC via termboy-gb, GBA via termboy-gba, Nintendo DS ARM9+ARM7 via nds_core), Link Cable sync, binary viewport packet encoder, and Switch Torzu/Fritchii vault session bridge for Zaimule"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
termboy-core = { path = "../../vendor/termboy-core" }
termboy-gb = { path = "../../vendor/termboy-gb" }
termboy-gba = { path = "../../vendor/termboy-gba" }
zaimule-core = { path = "../zaimule-core" }

[dev-dependencies]
sevenz-rust2 = "0.25.0"
