[package]
name = "zaimule-emu"
version = "0.7.0"
description = "Native Rust emulator cores (Game Boy/GBC with Link Cable, GBA ARM7TDMI, N64 MIPS VR4300 + RCP Z-Buffer 3D, Mega Drive Motorola 68000 + YM2612, NDS ARM9+ARM7 Dual-Screen, PS1 MIPS R3000A + GTE 3D PGXP, SNES 65C816/Mode 7, NES 6502/2C02, CHIP-8) and Libretro C-ABI host bridge for Zaimule"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zaimule-core = { path = "../zaimule-core" }
