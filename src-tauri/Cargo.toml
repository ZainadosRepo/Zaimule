[package]
name = "zaimule"
version = "1.9.0"
description = "Station d'émulation multi-consoles en Rust pur (GB, GBC, GBA, NDS), rembobinage 60s, keymapper, TAS Link Cable et Coffre Switch (Torzu / Fritchii)"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[lib]
name = "zaimule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
zaimule-core = { path = "../crates/zaimule-core" }
zaimule-emu = { path = "../crates/zaimule-emu" }
base64 = "0.23.1"
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
