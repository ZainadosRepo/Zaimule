[package]
name = "zaimule"
version = "0.2.0"
description = "Multi-console emulator station in Rust: native Rust & Libretro cores, 60s rewind, visual keymapper, TAS macros, Link Cable, and Yuzu-style overrides"
authors = ["ZainadosRepo"]
edition = "2021"
publish = false

[lib]
name = "zaimule_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
zaimule-core = { path = "../crates/zaimule-core" }
zaimule-emu = { path = "../crates/zaimule-emu" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"
